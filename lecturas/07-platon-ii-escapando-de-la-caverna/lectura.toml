# Lectura 07: Platón II: escapando de la caverna
# Precargada desde cursos/MEXX.toml (MEXX Lecturas del semestre). Cambia el grupo
# por el tuyo y prepárala en la consola, o:  ./estudio preparar lecturas/07-platon-ii-escapando-de-la-caverna

[lectura]
curso = "ME"                       # ME (Modelos estocásticos) o LP (Lenguajes de programación)
grupo = 1                          # dígito del grupo en el SIA
libro = "../../libros/Wilczek Frank - El Mundo Como Obra De Arte.pdf"
numero = 7
paginas = "61-72"                  # páginas del PDF, no las impresas. Ej.: "61-72" o "61-72, 446"
titulo = "Platón II: escapando de la caverna"
hasta = "descripciones verbales."  # texto con el que termina
nota = "El diálogo entre Sócrates y Glaucón pide voces distintas, y si aparecen más personajes, también. Agrégalos en Preparar › Citas, cada uno con su voz."

[pantalla]
ancho_figura = 0.38                # parte de la pantalla para la figura fija a la derecha (2.f)
dpi = 200
segundos_figura = 2                # cuánto se deja una figura sin pie (2.e)

[figuras]
detectar = true
persistente = true                 # 2.f: fija la figura a la derecha en los párrafos que hablan de ella
