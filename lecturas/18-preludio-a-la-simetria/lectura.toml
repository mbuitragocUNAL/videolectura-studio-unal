# Lectura 18: Preludio a la simetría
# Precargada desde cursos/MEXX.toml (MEXX Lecturas del semestre). Cambia el grupo
# por el tuyo y prepárala en la consola, o:  ./estudio preparar lecturas/18-preludio-a-la-simetria

[lectura]
curso = "ME"                       # ME (Modelos estocásticos) o LP (Lenguajes de programación)
grupo = 1                          # dígito del grupo en el SIA
libro = "../../libros/Wilczek Frank - El Mundo Como Obra De Arte.pdf"
numero = 18
paginas = "166-175"                # páginas del PDF, no las impresas. Ej.: "61-72" o "61-72, 446"
titulo = "Preludio a la simetría"
hasta = "hacia la teoría cuántica." # texto con el que termina
nota = "Incluye el capítulo corto «Preludio a la simetría» completo y la primera parte de «Belleza cuántica I: música de las Esferas»."

[pantalla]
ancho_figura = 0.38                # parte de la pantalla para la figura fija a la derecha (2.f)
dpi = 200
segundos_figura = 2                # cuánto se deja una figura sin pie (2.e)

[figuras]
detectar = true
persistente = true                 # 2.f: fija la figura a la derecha en los párrafos que hablan de ella
