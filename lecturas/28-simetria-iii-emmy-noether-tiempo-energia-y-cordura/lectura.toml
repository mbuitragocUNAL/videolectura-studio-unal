grupo = 1                          # dígito del grupo en el SIA
libro = "../../libros/Wilczek Frank - El Mundo Como Obra De Arte.pdf"
numero = 28
paginas = "276-284"                # páginas del PDF, no las impresas. Ej.: "61-72" o "61-72, 446"
titulo = "Simetría III: Emmy Noether, tiempo, energía y cordura"
hasta = "buscándola!"              # texto con el que termina

[pantalla]
