# Las 32 lecturas del semestre de Modelos Estocásticos y Simulación (MEXX),
# transcritas del documento «MEXX Lecturas del semestre» del profesor.
#
#   ./estudio precargar cursos/MEXX.toml
#
# crea lecturas/NN-titulo/lectura.toml para cada una (las que ya existen no
# se tocan) y busca en el PDF dónde empieza y dónde termina cada lectura.
# Después, en http://localhost:8100/lecturas, eliges la tuya, cambias el grupo
# por el tuyo y la preparas.
#
# Por lectura:
#   paginas      las del PDF, no las impresas
#   desde        el título de la sección con la que empieza (si no empieza al
#                comienzo de la primera página)
#   hasta_antes  el título de la sección siguiente: la lectura termina justo antes
#   hasta_pie    la figura cuyo pie cierra la lectura («Figura 13»)
#   nota         lo que el documento pide además, y que el estudio todavía no
#                hace solo

[curso]
codigo = "ME"
nombre = "Modelos Estocásticos y Simulación"
libro = "Wilczek Frank - El Mundo Como Obra De Arte.pdf"   # en libros/
fuente = "MEXX Lecturas del semestre"

[[lectura]]
numero = 1
titulo = "Carátula, cubiertas e instrucciones de uso"
paginas = "1-2, 4-6"
nota = """El orden es: la carátula (p. 1), la contracubierta y el interior de cubierta \
(no están en el PDF: están en la biblioteca digital del curso; el interior viene en mala \
calidad, conviene arreglarlo), y del PDF las páginas 2 a 6 sin la 3 (publicidad). En la \
página 4 se nombran las Láminas XX (p. 477) y AAA (p. 479): se muestran 2 o 3 segundos y \
luego se lee su pie."""

